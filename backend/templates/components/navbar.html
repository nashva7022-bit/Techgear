<nav class="bg-black text-white sticky top-0 z-50 shadow-md">
    <div class="container mx-auto px-4 md:px-8 max-w-[90rem] h-20 flex items-center justify-between">
        
        <!-- LEFT: Logo (Always Visible) -->
        <a href="{% if user.is_authenticated %}{% url 'home' %}{% else %}{% url 'landing' %}{% endif %}" class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-white text-black rounded flex items-center justify-center font-black text-lg">TG</div>
            <span class="text-2xl font-black tracking-widest uppercase">TechGear.</span>
        </a>

        {% if user.is_authenticated %}
            <!-- ======================================================= -->
            <!-- FULL NAVBAR -->
            <!-- ======================================================= -->

            <div class="hidden lg:flex items-center space-x-10 text-sm font-bold uppercase tracking-widest">
                <a href="{% url 'home' %}" class="hover:text-gray-400 transition">Home</a>
                
                <div class="relative group h-20 flex items-center cursor-pointer">
                    <span class="flex items-center hover:text-gray-400 transition">
                        Categories
                        <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </span>
                    
                    <div class="absolute top-[80px] left-0 w-64 bg-white text-black shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 border border-gray-200">
                        <a href="#" class="block px-6 py-4 text-sm font-bold hover:bg-gray-100 border-b">Phone Cases</a>
                        <a href="#" class="block px-6 py-4 text-sm font-bold hover:bg-gray-100 border-b">Laptop Skins</a>
                        <a href="#" class="block px-6 py-4 text-sm font-bold hover:bg-gray-100 border-b">Screen Protectors</a>
                        <a href="#" class="block px-6 py-4 text-sm font-bold hover:bg-gray-100 border-b">Phone Grips</a>
                        <a href="#" class="block px-6 py-4 text-sm font-bold hover:bg-gray-100">Earphones</a>
                    </div>
                </div>

                <a href="#" class="hover:text-gray-400 transition">Shop</a>
                <a href="#" class="hover:text-gray-400 transition">Contact Us</a>
            </div>

            <!-- RIGHT -->
            <div class="flex items-center space-x-6">
                <div class="hidden md:flex relative items-center">
                    <input type="text" placeholder="Search..." class="bg-gray-900 text-white border border-gray-700 text-sm rounded-full pl-5 pr-10 py-2.5 w-56 lg:w-72 focus:outline-none focus:border-white transition">
                </div>

                <a href="#" class="hover:text-gray-400 transition">❤️</a>

                <a href="#" class="hover:text-gray-400 transition relative">
                    🛒
                    <span class="absolute -top-1.5 -right-2 bg-white text-black text-[10px] px-1.5 py-0.5 rounded-full">0</span>
                </a>

                <!-- PROFILE -->
                <div class="relative">
                    <button id="profileButton" class="flex items-center">
                        {% if user.profile_image %}
                            <img src="{{ user.profile_image.url }}" class="w-9 h-9 rounded-full object-cover">
                        {% else %}
                            <div class="w-9 h-9 rounded-full bg-white text-black flex items-center justify-center">
                                {{ user.first_name|first|upper|default:"U" }}
                            </div>
                        {% endif %}
                    </button>

                    <div id="profileDropdown" class="hidden absolute right-0 mt-3 w-48 bg-white text-black shadow-xl rounded-md">
                        <a href="{% url 'dashboard' %}" class="block px-5 py-3 text-sm">My Profile</a>
                        <form action="{% url 'logout' %}" method="POST">
                            {% csrf_token %}
                            <button type="submit" class="w-full text-left px-5 py-3 text-sm text-red-600">
                                Logout
                            </button>
                        </form>
                    </div>
                </div>
            </div>

        {% else %}
            <!-- ======================================================= -->
            <!-- MINIMAL NAVBAR -->
            <!-- ======================================================= -->
            <div class="flex items-center space-x-4">

                {% if request.resolver_match.url_name == 'landing' %}
                    
                    <a href="{% url 'login' %}" 
                       class="text-sm font-bold uppercase tracking-wider hover:text-gray-400 transition">
                        Login
                    </a>

                    <a href="{% url 'signup' %}"
                       class="bg-white text-black px-4 py-2 rounded-lg text-sm font-bold uppercase tracking-wider hover:bg-gray-200 transition">
                        Sign Up
                    </a>

                {% endif %}

            </div>
        {% endif %}

    </div>
    <script>
    const btn = document.getElementById("profileButton");
    const dropdown = document.getElementById("profileDropdown");

    btn.addEventListener("click", function () {
        dropdown.classList.toggle("hidden");
    });

    // Optional: close when clicking outside
    document.addEventListener("click", function (e) {
        if (!btn.contains(e.target) && !dropdown.contains(e.target)) {
            dropdown.classList.add("hidden");
        }
    });
</script>
</nav>
