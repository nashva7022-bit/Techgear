{% extends 'base.html' %}

{% block content %}
<section class="flex-grow flex items-center justify-center py-12 px-6 bg-gray-50 dark:bg-zinc-950">
    <div class="bg-white dark:bg-zinc-900 p-8 rounded-2xl shadow-sm border border-gray-100 dark:border-zinc-800 w-full max-w-md text-center">
        
        <div class="inline-flex items-center justify-center w-16 h-16 bg-orange-50 dark:bg-orange-900/20 rounded-full mb-6">
            <svg class="w-8 h-8 text-orange-400" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </div>

        <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">Verify Your OTP</h1>
        <p class="text-gray-500 dark:text-gray-400 text-sm mb-8 px-4">
            Enter the code sent to your registered contact to reset your password
        </p>

        <form id="otp-form" method="POST" action="{% url 'verify_otp' %}">
            {% csrf_token %}
            <div class="flex justify-between gap-2 mb-4">
                <input type="number" name="otp_digit" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold border border-gray-200 dark:border-zinc-700 dark:bg-zinc-800 dark:text-white rounded-lg focus:border-orange-500 focus:ring-1 focus:ring-orange-500 outline-none transition-all" required>
                <input type="number" name="otp_digit" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold border border-gray-200 dark:border-zinc-700 dark:bg-zinc-800 dark:text-white rounded-lg focus:border-orange-500 focus:ring-1 focus:ring-orange-500 outline-none transition-all" required>
                <input type="number" name="otp_digit" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold border border-gray-200 dark:border-zinc-700 dark:bg-zinc-800 dark:text-white rounded-lg focus:border-orange-500 focus:ring-1 focus:ring-orange-500 outline-none transition-all" required>
                <input type="number" name="otp_digit" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold border border-gray-200 dark:border-zinc-700 dark:bg-zinc-800 dark:text-white rounded-lg focus:border-orange-500 focus:ring-1 focus:ring-orange-500 outline-none transition-all" required>
                <input type="number" name="otp_digit" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold border border-gray-200 dark:border-zinc-700 dark:bg-zinc-800 dark:text-white rounded-lg focus:border-orange-500 focus:ring-1 focus:ring-orange-500 outline-none transition-all" required>
                <input type="number" name="otp_digit" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold border border-gray-200 dark:border-zinc-700 dark:bg-zinc-800 dark:text-white rounded-lg focus:border-orange-500 focus:ring-1 focus:ring-orange-500 outline-none transition-all" required>
            </div>

            <div id="timer-container" class="text-orange-500 text-sm font-medium mb-8">
                <span id="timer">02:00</span> remaining
            </div>

            <button type="submit" class="w-full bg-black dark:bg-white dark:text-black text-white font-bold py-3 rounded-lg hover:opacity-90 transition duration-200 mb-4">
                Verify OTP
            </button>
        </form>

        <a href="{% url 'login' %}" class="text-orange-500 text-xs font-semibold hover:underline">← Back to Login</a>

        <div class="mt-8 pt-6 border-t border-gray-100 dark:border-zinc-800 text-sm text-gray-500">
    Didn't receive the code? 
    <form action="{% url 'resend_otp' %}" method="POST" class="inline">
        {% csrf_token %}
        <button type="submit" id="resend-btn" 
            class="text-orange-500 font-bold opacity-50 cursor-not-allowed transition-all" 
            disabled>
            Resend Code
        </button>
    </form>
</div>
    </div>
</section>

<script>
    // 1. Timer Logic
// Use the time from the backend or default to 120 (2 minutes)
let timeLeft = {{ remaining_time|default:120 }}; 
const timerDisplay = document.getElementById('timer');
const resendBtn = document.getElementById('resend-btn');

const countdown = setInterval(() => {
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;
    timerDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

    if (timeLeft <= 0) {
        clearInterval(countdown);
        document.getElementById('timer-container').innerHTML = "Code expired";
        
        // ENABLE THE BUTTON
        resendBtn.disabled = false;
        resendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        resendBtn.classList.add('hover:underline', 'cursor-pointer');
    } else {
        timeLeft--;
    }
}, 1000);
    // 2. OTP Auto-focus jumping
    const inputs = document.querySelectorAll('.otp-input');
    inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
            if (e.target.value.length > 1) e.target.value = e.target.value.slice(0, 1);
            if (e.target.value && index < inputs.length - 1) inputs[index + 1].focus();
        });
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !e.target.value && index > 0) inputs[index - 1].focus();
        });
    });
</script>

<style>
    /* Hides arrows on number inputs */
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
        -webkit-appearance: none; margin: 0;
    }
</style>
{% endblock %}
