{% extends 'base.html' %}
{% block title %}Forgot Password | TechGear{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[75vh] px-4">
    <div class="max-w-sm w-full bg-white dark:bg-gray-900 rounded-xl shadow-lg border border-gray-100 dark:border-gray-800 p-6 sm:p-7 text-center">
        
        <!-- Lock Icon -->
        <div class="mx-auto w-12 h-12 bg-gray-100 dark:bg-gray-800 rounded-full flex items-center justify-center mb-5">
            <svg class="w-6 h-6 text-black dark:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
        </div>

        <!-- Headers -->
        <h2 class="text-2xl font-bold text-black dark:text-white mb-2">Reset Password</h2>
        <p class="text-xs text-gray-500 font-medium mb-6 leading-relaxed">
            Enter your email and we’ll send a 6-digit OTP to reset your password.
        </p>

        <!-- Form -->
        <form method="POST" action="{% url 'forgot_password' %}" class="space-y-5 text-left">
            {% csrf_token %}
            
            <div>
                <label class="block text-[11px] font-semibold text-gray-500 tracking-wide uppercase mb-1">
                    Email Address
                </label>
                <input type="email" name="email" placeholder="name@example.com" required
                       class="w-full px-3 py-2.5 rounded-md border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-black dark:text-white focus:border-black dark:focus:border-white focus:ring-1 focus:ring-black dark:focus:ring-white outline-none transition text-sm">
            </div>

            <!-- Button -->
            <button type="submit"
                class="w-full bg-black hover:bg-gray-800 dark:bg-white dark:text-black dark:hover:bg-gray-200 text-white font-semibold py-2.5 px-4 rounded-lg transition duration-200">
                Send OTP
            </button>
        </form>

        <!-- Back to Login -->
        <div class="mt-6 text-sm">
            <a href="{% url 'login' %}"
               class="flex items-center justify-center text-gray-600 dark:text-gray-400 hover:text-black dark:hover:text-white transition font-medium">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Back to Login
            </a>
        </div>

    </div>
</div>
{% endblock %}
