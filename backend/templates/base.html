<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TechGear{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Tailwind Dark Mode Config
        tailwind.config = { darkMode: 'class' }
        
        // INSTANT DARK MODE LOAD (Prevents flash on reload)
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-white text-black dark:bg-black dark:text-white flex flex-col min-h-screen font-sans antialiased transition-colors duration-300">

    <!-- Include Conditional Black Navbar -->
    {% include 'components/navbar.html' %}

    <!-- Global Django Alert Messages -->
  {% if messages %}
<div class="fixed top-5 right-5 z-50 space-y-3 w-80">
    {% for message in messages %}
        <div class="message-box px-4 py-3 rounded-lg shadow-md text-sm font-semibold
            {% if message.tags == 'error' %}
                bg-red-100 text-red-700 border border-red-300
            {% elif message.tags == 'success' %}
                bg-green-100 text-green-700 border border-green-300
            {% else %}
                bg-gray-100 text-gray-700
            {% endif %}
        ">
            {{ message }}
        </div>
    {% endfor %}
</div>
{% endif %}
    <!-- Main Page Content -->
    <main class="flex-grow w-full">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Include Black Footer -->
    {% include 'components/footer.html' %}

    <script>
    setTimeout(() => {
        document.querySelectorAll('.message-box').forEach(msg => {
            msg.style.transition = "opacity 0.5s ease";
            msg.style.opacity = "0";
            setTimeout(() => msg.remove(), 500);
        });
    }, 3000); // disappears after 3 seconds
</script>

</body>
</html>
