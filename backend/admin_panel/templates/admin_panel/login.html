<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | TechGear</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen font-sans">

    <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg">

        <!-- HEADER -->
        <div class="text-center mb-6">
            <div class="w-12 h-12 bg-black text-white flex items-center justify-center rounded-lg mx-auto mb-3">
                TG
            </div>
            <h2 class="text-xl font-bold">Admin Login</h2>
            <p class="text-gray-500 text-sm">Access your dashboard</p>
        </div>

       

        <!-- FORM -->
        <form method="POST">
            {% csrf_token %}

            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Email</label>
                {{ form.email }}
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Password</label>
                {{ form.password }}
            </div>

            <button type="submit"
                    class="w-full bg-black text-white py-2 rounded-lg hover:bg-gray-800 transition">
                Login
            </button>
        </form>

    </div>

</body>
</html>
