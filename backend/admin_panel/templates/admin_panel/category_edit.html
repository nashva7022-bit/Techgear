{% extends 'admin_panel/admin_base.html' %}
{% block content %}

<!-- Breadcrumb -->
<nav class="flex items-center gap-2 text-xs text-gray-400 font-semibold mb-6">
  <a href="{% url 'admin_category_list' %}" class="hover:text-black transition">Categories</a>
  <span class="text-gray-300">/</span>
  <span class="text-gray-700">Edit — {{ category.name }}</span>
</nav>

<div class="max-w-2xl">
  <div class="mb-6">
    <h1 class="text-xl font-bold text-gray-900">Edit Category</h1>
    <p class="text-sm text-gray-400 mt-0.5">Update the details for "{{ category.name }}".</p>
  </div>

  <form method="POST" enctype="multipart/form-data" action="{% url 'admin_category_edit' category.pk %}" class="space-y-5">
    {% csrf_token %}

    <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 space-y-5">

      <!-- Name -->
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">
          Category Name <span class="text-red-500">*</span>
        </label>
        <input type="text" name="name"
               value="{{ form.name.value|default:'' }}"
               placeholder="e.g. Phone Cases"
               class="w-full px-4 py-2.5 rounded-lg border text-sm outline-none transition
               {% if form.name.errors %}border-red-400 bg-red-50{% else %}border-gray-200 focus:border-black{% endif %}">
        {% if form.name.errors %}
        <p class="flex items-center gap-1 text-red-500 text-xs mt-1.5 font-medium">
          <svg class="w-3 h-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          {{ form.name.errors.0 }}
        </p>
        {% endif %}
      </div>

      <!-- Description -->
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">
          Description
        </label>
        <textarea name="description" rows="3"
                  placeholder="Short description..."
                  class="w-full px-4 py-2.5 rounded-lg border border-gray-200 text-sm outline-none focus:border-black transition resize-none">{{ form.description.value|default:'' }}</textarea>
      </div>

      

      <!-- Status -->
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">
          Status
        </label>
        <div class="flex gap-4">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" name="is_active" value="True"
                   class="accent-black"
                   {% if form.is_active.value %}checked{% endif %}>
            <span class="text-sm font-medium text-gray-700">Active</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" name="is_active" value="False"
                   class="accent-black"
                   {% if not form.is_active.value %}checked{% endif %}>
            <span class="text-sm font-medium text-gray-700">Inactive</span>
          </label>
        </div>
      </div>

    </div>

    <!-- Actions -->
    <div class="flex items-center gap-3">
      <button type="submit"
              class="px-6 py-2.5 bg-black text-white rounded-lg text-sm font-bold hover:bg-gray-800 transition">
        Update Category
      </button>
      <a href="{% url 'admin_category_list' %}"
         class="px-6 py-2.5 border border-gray-200 rounded-lg text-sm font-semibold text-gray-500 hover:bg-gray-50 transition">
        Cancel
      </a>
    </div>
  </form>
</div>


{% endblock %}
