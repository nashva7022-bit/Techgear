<div class="w-64 bg-black min-h-screen text-white flex flex-col fixed left-0 top-0">
    <div class="p-6 border-b border-gray-800">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-white text-black rounded flex items-center justify-center text-xs font-black">TG</div>
            <span class="text-sm font-bold tracking-widest uppercase">TechGear</span>
        </div>
    </div>

    <nav class="flex-1 px-4 py-4 space-y-1 overflow-y-auto">

        <a href="{% url 'admin_dashboard' %}"
           class="flex items-center space-x-3 p-2.5 rounded-lg transition text-sm
           {% if request.resolver_match.url_name == 'admin_dashboard' %}bg-white text-black font-semibold{% else %}text-gray-400 hover:bg-gray-900{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span>Dashboard</span>
        </a>

        <a href="#"
           class="flex items-center space-x-3 p-2.5 rounded-lg transition text-sm
           {% if request.resolver_match.url_name == 'admin_orders' %}bg-white text-black font-semibold{% else %}text-gray-400 hover:bg-gray-900{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
            <span>Orders</span>
        </a>

        <a href="{% url 'admin_product_list' %}"
           class="flex items-center space-x-3 p-2.5 rounded-lg transition text-sm
           {% if 'product' in request.resolver_match.url_name %}bg-white text-black font-semibold{% else %}text-gray-400 hover:bg-gray-900{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
            <span>Products</span>
        </a>

        <a href="{% url 'admin_category_list' %}"
           class="flex items-center space-x-3 p-2.5 rounded-lg transition text-sm
           {% if 'category' in request.resolver_match.url_name %}bg-white text-black font-semibold{% else %}text-gray-400 hover:bg-gray-900{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
            <span>Categories</span>
        </a>

        <a href="{% url 'admin_category_list' %}"
           class="flex items-center space-x-3 p-2.5 rounded-lg transition text-sm
           {% if 'variant' in request.resolver_match.url_name %}bg-white text-black font-semibold{% else %}text-gray-400 hover:bg-gray-900{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
            <span>Variants</span>
        </a>

        <a href="{% url 'admin_user_management' %}"
           class="flex items-center space-x-3 p-2.5 rounded-lg transition text-sm
           {% if request.resolver_match.url_name == 'admin_user_management' %}bg-white text-black font-semibold{% else %}text-gray-400 hover:bg-gray-900{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            <span>Users</span>
        </a>

        <a href="#"
           class="flex items-center space-x-3 p-2.5 rounded-lg transition text-sm
           {% if request.resolver_match.url_name == 'admin_offers' %}bg-white text-black font-semibold{% else %}text-gray-400 hover:bg-gray-900{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg>
            <span>Offers</span>
        </a>

        <a href="#"
           class="flex items-center space-x-3 p-2.5 rounded-lg transition text-sm
           {% if request.resolver_match.url_name == 'admin_coupons' %}bg-white text-black font-semibold{% else %}text-gray-400 hover:bg-gray-900{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>
            <span>Coupons</span>
        </a>

        <a href="#"
           class="flex items-center space-x-3 p-2.5 rounded-lg transition text-sm
           {% if request.resolver_match.url_name == 'admin_banners' %}bg-white text-black font-semibold{% else %}text-gray-400 hover:bg-gray-900{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"/></svg>
            <span>Banners</span>
        </a>

        <a href="#"
           class="flex items-center space-x-3 p-2.5 rounded-lg transition text-sm
           {% if request.resolver_match.url_name == 'admin_reports' %}bg-white text-black font-semibold{% else %}text-gray-400 hover:bg-gray-900{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            <span>Reports</span>
        </a>

        <a href="#"
           class="flex items-center space-x-3 p-2.5 rounded-lg transition text-sm
           {% if request.resolver_match.url_name == 'admin_returns' %}bg-white text-black font-semibold{% else %}text-gray-400 hover:bg-gray-900{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 15v-1a4 4 0 00-4-4H8m0 0l3 3m-3-3l3-3m9 14V5a2 2 0 00-2-2H6a2 2 0 00-2 2v16l4-2 4 2 4-2 4 2z"/></svg>
            <span>Return Requests</span>
        </a>

    </nav>

    <div class="p-4 border-t border-gray-800">
        <form action="{% url 'admin_logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="w-full text-left p-2 text-red-400 hover:text-red-300 transition flex items-center space-x-3 text-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                <span>Logout</span>
            </button>
        </form>
    </div>
</div>
