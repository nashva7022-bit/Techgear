{% extends 'base.html' %}
{% load static %}

{% block title %}Add Money — TechGear Wallet{% endblock %}

{% block content %}
<style>
  :root {
    --bg:      #F9F9F6;
    --surface: #FFFFFF;
    --alt-bg:  #EFEDE6;
    --accent:  #2D4330;
    --ink:     #111111;
    --muted:   rgba(17,17,17,0.45);
    --border:  rgba(17,17,17,0.10);
  }

  body { background-color: var(--bg); color: var(--ink); }

  .pay-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px;
    max-width: 480px;
    margin: 60px auto;
    text-align: center;
    box-shadow: 0 1px 3px rgba(17,17,17,0.04);
  }
  .spinner {
    width: 48px; height: 48px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 24px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .amount-badge {
    display: inline-block;
    background: var(--alt-bg);
    border: 1px solid var(--border);
    border-radius: 99px;
    padding: 8px 20px;
    font-size: 22px;
    font-weight: 900;
    color: var(--ink);
    margin: 16px 0 24px;
  }
  .retry-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 28px; border-radius: 12px;
    background: var(--accent); color: #fff;
    font-size: 13px; font-weight: 800;
    letter-spacing: 0.05em; text-transform: uppercase;
    border: none; cursor: pointer; transition: background 0.15s;
    margin-top: 16px;
  }
  .retry-btn:hover { background: #111111; }
  .cancel-link {
    display: block; margin-top: 14px;
    font-size: 12px; color: var(--muted);
    text-decoration: none; transition: color 0.15s;
  }
  .cancel-link:hover { color: var(--ink); }
</style>

<div class="container mx-auto px-6">
  <div class="pay-card">
    <div class="spinner" id="spinner"></div>
    <h1 class="text-xl font-bold text-ink mb-2">Adding Money to Wallet</h1>
    <p class="text-ink/40 text-sm mb-2">Please do not close this page</p>
    <div class="amount-badge">₹{{ amount_display }}</div>
    <p class="text-ink/40 text-xs">Secure payment via Razorpay</p>

    <button id="retryBtn" class="retry-btn hidden" onclick="openRazorpay()">
      <i class="bi bi-arrow-clockwise"></i> Try Again
    </button>
    <a href="{% url 'wallet:wallet' %}" class="cancel-link hidden" id="cancelLink">
      Cancel and go back to wallet
    </a>
  </div>
</div>

<form id="callbackForm" method="POST" action="{% url 'wallet:topup_callback' %}">
  {% csrf_token %}
  <input type="hidden" name="razorpay_payment_id" id="rzp_payment_id">
  <input type="hidden" name="razorpay_order_id"   id="rzp_order_id">
  <input type="hidden" name="razorpay_signature"  id="rzp_signature">
</form>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
let paymentDone = false;

const RZP_OPTIONS = {
  key:         '{{ razorpay_key }}',
  amount:      {{ amount }},
  currency:    'INR',
  name:        'TechGear',
  description: 'Wallet Top-up',
  order_id:    '{{ razorpay_order.id }}',
  prefill: {
    name:    "{{ user_name|escapejs }}",
    email:   "{{ user_email|escapejs }}",
    contact: "{{ user_phone|escapejs }}",
  },
  theme: { color: '#2D4330' },
  handler: function(response) {
    paymentDone = true;
    document.getElementById('rzp_payment_id').value = response.razorpay_payment_id;
    document.getElementById('rzp_order_id').value   = response.razorpay_order_id;
    document.getElementById('rzp_signature').value  = response.razorpay_signature;
    document.getElementById('callbackForm').submit();
  },
  modal: {
    ondismiss: function() {
      setTimeout(function() {
        if (paymentDone) return;
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('retryBtn').classList.remove('hidden');
        document.getElementById('cancelLink').classList.remove('hidden');
        fetch("{% url 'wallet:topup_failed' %}", {
          method: 'POST',
          headers: { 'X-CSRFToken': '{{ csrf_token }}' },
          body: ''
        });
      }, 3000);
    }
  }
};

function openRazorpay() {
  document.getElementById('spinner').style.display = 'block';
  document.getElementById('retryBtn').classList.add('hidden');
  document.getElementById('cancelLink').classList.add('hidden');

  const rzp = new Razorpay(RZP_OPTIONS);
  rzp.on('payment.failed', function() {
    if (paymentDone) return;
    fetch("{% url 'wallet:topup_failed' %}", {
      method: 'POST',
      headers: { 'X-CSRFToken': '{{ csrf_token }}' },
      body: ''
    }).then(function() {
      window.location.href = "{% url 'wallet:wallet' %}";
    });
  });
  rzp.open();
}

window.addEventListener('load', function() {
  setTimeout(openRazorpay, 500);
});
</script>
{% endblock %}
