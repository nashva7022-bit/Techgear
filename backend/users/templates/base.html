

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TechGear{% endblock %}</title>

    <!-- Bootstrap Icons for Cart/Heart/Close -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <script>
        // Initial Theme Check (prevents white flash)
        if (localStorage.getItem('theme') === 'dark' ||
           (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'site-bg': '#557373',      
                        'card-bg': '#DFE5F3',      
                        'accent-hover': '#F2EFEA',
                    },
                    fontFamily: {
                        'serif': ['Lora', 'serif'],
                        'sans': ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<!-- min-h-screen and flex flex-col pushes the footer to the bottom of the page -->
<body class="bg-site-bg text-white font-sans antialiased min-h-screen flex flex-col transition-colors duration-300">
    
    <!-- Navbar Included Here -->
    {% include 'components/navbar.html' %}

    <!-- Auto-Dismissing Message Blocks -->
    {% if messages %}
    <div class="fixed top-24 right-5 z-[100] w-80 space-y-3">
        {% for message in messages %}
            <div class="msg flex items-center justify-between p-4 rounded-xl shadow-lg 
                {% if message.tags == 'error' %}bg-red-500{% else %}bg-green-600{% endif %}">
                <span class="text-sm font-bold">{{ message }}</span>
                <button onclick="this.parentElement.remove()" class="ml-3 font-bold text-lg hover:opacity-70">×</button>
            </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- pt-24 is critical: ensures your content isn't hidden under the fixed Navbar -->
    <main class="flex-grow w-full pt-24">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer Included Here -->
    {% include 'components/footer.html' %}

    <script>
        // 1. Message Timer (5 seconds)
        setTimeout(() => { 
            document.querySelectorAll('.msg').forEach(m => m.remove()); 
        }, 5000);

        // 2. Theme Toggling Logic
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }
        function updateCartBadge(count) {
    const badge = document.getElementById('cartBadge');
    if (!badge) return;
    badge.textContent = count;
    if (count > 0) {
        badge.classList.remove('hidden');
    } else {
        badge.classList.add('hidden');
    }
}

function updateWishlistBadge(count) {
    const badge = document.getElementById('wishlistBadge');
    if (!badge) return;
    badge.textContent = count;
    if (count > 0) {
        badge.classList.remove('hidden');
    } else {
        badge.classList.add('hidden');
    }
}
</script>
    
</body>
</html>
