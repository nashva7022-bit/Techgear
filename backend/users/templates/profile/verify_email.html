{% extends 'base.html' %}
{% block title %}Verify Email | TechGear{% endblock %}

{% block content %}
<div class="flex items-center justify-center py-20 px-6">
    <div class="max-w-md w-full bg-card-bg text-site-bg rounded-[2rem] shadow-2xl p-10 text-center">
        <div class="text-5xl mb-6"><i class="bi bi-envelope-check"></i></div>
        <h2 class="text-3xl font-serif font-bold mb-4">Verification</h2>
        <p class="text-sm mb-8">Enter the 6-digit code sent to your email.</p>

        <form method="POST" id="otp-form" class="space-y-6">
            {% csrf_token %}
            <!-- This creates the inputs named "otp_digit" that your views.py uses -->
            <div class="flex justify-center gap-2" id="otp-container">
                {% for i in "123456" %}
                <input type="text" name="otp_digit" maxlength="1" required 
                       class="otp-input w-12 h-14 text-center text-2xl font-bold rounded-lg border border-site-bg/20 bg-white focus:ring-2 focus:ring-site-bg outline-none transition">
                {% endfor %}
            </div>

            <button type="submit" class="w-full bg-site-bg text-white font-bold py-4 rounded-xl hover:opacity-90 transition">Verify Email</button>
        </form>

        <!-- Add this loop exactly below the Submit button in verify_email.html -->
<!-- Use this exact code block in verify_email.html -->


        <div class="mt-8 text-sm">
            <p id="timer-text" class="font-bold opacity-60">Resend code in <span id="time-remaining">{{ remaining_time }}</span>s</p>
            
            <form method="POST" action="{% url 'resend_otp' %}" id="resend-form" class="hidden">
                {% csrf_token %}
                <button type="submit" class="text-site-bg font-bold border-b border-site-bg">Resend Verification Code</button>
            </form>
        </div>
    </div>
</div>

<script>
    const inputs = document.querySelectorAll('.otp-input');
    inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
            if (e.target.value.length > 1) e.target.value = e.target.value.slice(0, 1);
            if (e.target.value !== '' && index < inputs.length - 1) inputs[index + 1].focus();
        });
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && e.target.value === '' && index > 0) inputs[index - 1].focus();
        });
    });

    // Simple Timer
    let time = {{ remaining_time }};
    const timerText = document.getElementById('timer-text');
    const resendForm = document.getElementById('resend-form');
    const timeVal = document.getElementById('time-remaining');
    const interval = setInterval(() => {
        time--;
        timeVal.innerText = time;
        if(time <= 0) {
            clearInterval(interval);
            timerText.classList.add('hidden');
            resendForm.classList.remove('hidden');
        }
    }, 1000);
</script>
{% endblock %}
